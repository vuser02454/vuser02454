name: Contribution Skyline

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate skyline
        env:
          GH_PROFILE_TOKEN: ${{ secrets.GH_PROFILE_TOKEN }}
        run: python scripts/contribution_skyline.py

      - name: Commit generated image
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add generated/
          if ! git diff --cached --quiet; then
            git commit -m "Update contribution skyline"
            git push
          fi
